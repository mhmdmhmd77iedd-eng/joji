<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#110a14" />
  <meta name="description" content="جوجي: محرر صور سريع على جهازك. قص، إضاءة، ألوان، فلاتر، وحفظ بالدقة الكاملة." />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-512.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="جوجي" />
  <title>جوجي</title>
  <script type="module" crossorigin src="./assets/index-DLomH9y3.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Ovf-sYKP.css">
</head>
<body>
  <div id="app">
    <!-- Home -->
    <section id="home" class="screen" aria-label="الرئيسية">
      <div class="touch-light" aria-hidden="true"></div>
      <div class="home-glow" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="grain" aria-hidden="true"></div>
      <header class="home-top">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">جوجي</span></div>
        <button id="open-btn" class="icon-btn glass" type="button" aria-label="افتح صورة"><span class="ic" data-icon="ImagePlus"></span></button>
      </header>
      <div class="home-body">
        <h1 class="home-title">صورتك، <em>بأجمل نسخة</em></h1>
        <p class="home-lead">اختر ما تريد، والباقي علينا.</p>
        <div class="hero-grid" id="hero-grid"></div>
        <div class="sec-head"><h2>أدوات سريعة</h2></div>
        <div class="quick" id="quick"></div>
        <p class="home-note"><span class="ic sm" data-icon="ShieldCheck"></span> صورك تبقى على جهازك ولا تُرفع لأي مكان</p>
      </div>
      <input id="file" type="file" accept="image/*" hidden />
      <div class="drop-hint" aria-hidden="true"><span>أفلت الصورة هنا</span></div>
    </section>

    <!-- Editor -->
    <section id="editor" class="screen" aria-label="المحرر" hidden>
      <canvas class="ambient" id="ambient" width="24" height="24" aria-hidden="true"></canvas>
      <header class="topbar">
        <button class="icon-btn" id="close-btn" type="button" aria-label="إغلاق"><span class="ic" data-icon="X"></span></button>
        <div class="topbar-mid">
          <button class="icon-btn" id="undo-btn" type="button" aria-label="تراجع" disabled><span class="ic" data-icon="Undo2"></span></button>
          <button class="icon-btn" id="redo-btn" type="button" aria-label="إعادة" disabled><span class="ic" data-icon="Redo2"></span></button>
          <button class="icon-btn" id="cmd-btn" type="button" aria-label="اكتب طلبك"><span class="ic" data-icon="MessageSquareText"></span></button>
          <button class="icon-btn" id="compare-btn" type="button" aria-label="قبل وبعد" aria-pressed="false"><span class="ic" data-icon="Columns2"></span></button>
        </div>
        <button class="btn-primary btn-sm" id="save-btn" type="button">حفظ</button>
      </header>

      <div class="stage" id="stage">
        <div class="viewport" id="viewport">
          <canvas id="view" aria-label="الصورة"></canvas>
          <div class="split" id="split" hidden>
            <div class="split-line"></div>
            <div class="split-knob"><span class="ic sm" data-icon="ArrowLeftRight"></span></div>
            <span class="tag tag-before">قبل</span>
            <span class="tag tag-after">بعد</span>
          </div>
          <div class="cropbox" id="cropbox" hidden>
            <div class="crop-shade"></div>
            <div class="crop-rect" id="crop-rect">
              <i class="g g1"></i><i class="g g2"></i><i class="g g3"></i><i class="g g4"></i>
              <b class="h" data-h="nw"></b><b class="h" data-h="ne"></b><b class="h" data-h="sw"></b><b class="h" data-h="se"></b>
              <b class="e" data-h="n"></b><b class="e" data-h="s"></b><b class="e" data-h="w"></b><b class="e" data-h="e"></b>
            </div>
            <span class="crop-label" id="crop-label"></span>
          </div>
        </div>
        <div class="hold-tag" id="hold-tag" hidden>الأصلية</div>
        <div class="hud" id="hud" aria-live="polite"><span class="hud-name"></span><b class="hud-val"></b><span class="hud-bar"><i></i></span></div>
        <div class="coach" id="coach" hidden>
          <div class="coach-dot"></div>
          <p><b>الصورة هي أداة التحكم</b><span>اسحب عليها يميناً ويساراً للتعديل، وفوق وتحت للأداة التالية. اضغط مطولاً لقائمة الأدوات.</span></p>
        </div>
      </div>

      <div class="dock">
        <div class="panel-host" id="panel-host"></div>
        <nav class="tabs" id="tabs" aria-label="الأدوات"></nav>
      </div>
    </section>

    <div class="sheet-wrap" id="sheet-wrap" hidden>
      <div class="sheet-backdrop" id="sheet-backdrop"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>
</body>
</html>
